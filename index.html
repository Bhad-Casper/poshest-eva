    const container = document.getElementById("products");

    function renderProducts() {
      container.innerHTML = "";
      for (let category in products) {
        const sect = document.createElement("div");
        sect.className = "category-group";
        sect.innerHTML = `<h2 class="cat-title">${format(category)}</h2>`;
        const data = products[category];
        if (Array.isArray(data)) {
          const grid = document.createElement("div"); grid.className = "product-grid";
          data.forEach(p => grid.innerHTML += productCard(p));
          sect.appendChild(grid);
        } else {
          for (let sub in data) {
            sect.innerHTML += `<h3 class="sub-title">${format(sub)}</h3>`;
            const grid = document.createElement("div"); grid.className = "product-grid";
            data[sub].forEach(p => grid.innerHTML += productCard(p));
            sect.appendChild(grid);
          }
        }
        container.appendChild(sect);
      }
    }

    function productCard(p) {
      return `
        <div class="card" data-name="${p.name.toLowerCase()}">
          <div class="image-container">
            <img src="${p.image}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/250?text=Product'">

          <div class="card-content">

            <p class="price">₦${p.price}</p>

          </div>
        </div>`;
    }

    function format(s) { return s.replace(/([a-z])([A-Z])/g, "$1 $2").replace(/^\w/, c => c.toUpperCase()); }

    function filterProducts() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      document.querySelectorAll(".card").forEach(c => {
        const match = c.getAttribute("data-name").includes(q);
        c.classList.toggle("hidden", !match);
      });
    }
